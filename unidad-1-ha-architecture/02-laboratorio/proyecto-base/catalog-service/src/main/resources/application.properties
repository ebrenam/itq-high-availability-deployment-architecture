# Catalog Service - Application Configuration
# Unidad 1: Arquitecturas de alta disponibilidad y escalabilidad
# HTTP Configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
# Application Metadata
quarkus.application.name=catalog-service
quarkus.application.version=1.0.0
# Health Check Configuration
# Endpoint: /health (general), /live (liveness), /ready (readiness)
quarkus.smallrye-health.root-path=/health
quarkus.smallrye-health.liveness-path=/live
quarkus.smallrye-health.readiness-path=/ready
# Logging Configuration
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=INFO
# Log levels per package
quarkus.log.category."com.ecom.catalog".level=INFO
# Development Mode Configuration (solo activo en dev mode)
%dev.quarkus.log.console.level=DEBUG
%dev.quarkus.log.category."com.ecom.catalog".level=DEBUG
# Fault Tolerance Metrics (opcional - para observabilidad)
# Estas métricas se usarán en la Unidad 5
quarkus.smallrye-fault-tolerance.metrics.enabled=true
# CORS Configuration (opcional - útil para desarrollo con frontend)
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=*
# Banner personalizado (opcional)
quarkus.banner.enabled=true
