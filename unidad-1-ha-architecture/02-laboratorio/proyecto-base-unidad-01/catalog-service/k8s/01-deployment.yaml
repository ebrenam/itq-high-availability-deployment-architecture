apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  labels:
    app: catalog-service
    version: v1.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
        version: v1.0.0
    spec:
      containers:
        - name: catalog-service
          image: <TU_USUARIO>/catalog-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http

          # Health Checks: Los endpoints fueron validados manualmente en Lab 1.1
          # Ahora Kubernetes los valida automáticamente

          # Readiness Probe: ¿Está listo para recibir tráfico?
          # Endpoint validado en Lab 1.1: curl http://localhost:8080/ready
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          # Liveness Probe: ¿Está vivo el contenedor?
          # Endpoint validado en Lab 1.1: curl http://localhost:8080/live
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
