apiVersion: v1
kind: Service
metadata:
  name: catalog-service-lb
  labels:
    app: catalog-service
    tier: backend
  annotations:
    # Documentación del servicio
    description: "LoadBalancer service for catalog-service - exposes HTTP endpoint"
spec:
  type: LoadBalancer
  selector:
    app: catalog-service
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  sessionAffinity: None

  # Configuración de distribución de tráfico
  # Para producción se recomienda usar Service Mesh (U3)
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
